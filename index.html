<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conjugaison italienne</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap');

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f6e7d8, #f2c6a0);
    font-family: 'Poppins', sans-serif;
}

.container {
    background: #fffaf4;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    max-width: 420px;
    width: 100%;
}

h1 {
    font-family: 'Playfair Display', serif;
    color: #7a3e2b;
    text-align: center;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    font-size: 0.8rem;
    margin-bottom: 4px;
    color: #7a3e2b;
    font-weight: 500;
}

input, select {
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #e0c3a3;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 10px;
    border-radius: 30px;
    border: none;
    background: #c76b4f;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #a9543c;
}

.resultat {
    margin-top: 20px;
    text-align: center;
    font-weight: 500;
    color: #7a3e2b;
}
</style>
</head>

<body>

<div class="container">
<h1>Conjugazione Italiana</h1>

<div class="form-group">
    <input type="text" id="verbe" placeholder="Entrez un infinitif">
</div>

<div class="form-group">
    <label for="tense">Temps</label>
    <select id="tense">
        <option value="present">Présent</option>
        <option value="imparfait">Imparfait</option>
        <option value="futur">Futur</option>
        <option value="passeCompose">Passé composé</option>
    </select>
</div>

<div class="form-group">
    <label for="mode">Mode</label>
    <select id="mode">
        <option value="indicatif">Indicatif</option>
    </select>
</div>

<div class="form-group">
    <label for="groupe">Groupe</label>
    <select id="groupe">
        <option value="are">-are</option>
        <option value="ere">-ere</option>
        <option value="ire">-ire</option>
    </select>
</div>

<div class="form-group">
    <label for="pronom">Pronom</label>
    <select id="pronom">
        <option value="io">io</option>
        <option value="tu">tu</option>
        <option value="lui">lui/lei</option>
        <option value="noi">noi</option>
        <option value="voi">voi</option>
        <option value="loro">loro</option>
    </select>
</div>

<button id="valider" type="button">Conjuguer</button>

<div class="resultat" id="resultat"></div>

</div>

<script>

const terminaisons = {
    present: {
        are: ["o","i","a","iamo","ate","ano"],
        ere: ["o","i","e","iamo","ete","ono"],
        ire: ["o","i","e","iamo","ite","ono"]
    },
    imparfait: {
        are: ["avo","avi","ava","avamo","avate","avano"],
        ere: ["evo","evi","eva","evamo","evate","evano"],
        ire: ["ivo","ivi","iva","ivamo","ivate","ivano"]
    },
    futur: {
        all: ["ò","ai","à","emo","ete","anno"]
    },
    passeCompose: {
        are: ["ato"],
        ere: ["uto"],
        ire: ["ito"]
    }
};

const personnes = ["io","tu","lui","noi","voi","loro"];

function getRadical(verbe, groupe, tense) {

    if (tense === "futur") {
        if (groupe === "are") {
            return verbe.slice(0, -3) + "er";
        }
        return verbe.slice(0, -1);
    }

    return verbe.slice(0, -3);
}

function conjuguer() {

    const verbe = document.getElementById("verbe").value.trim().toLowerCase();
    const tense = document.getElementById("tense").value;
    const groupe = document.getElementById("groupe").value;
    const pronom = document.getElementById("pronom").value;

    if (!verbe.endsWith(groupe)) {
        document.getElementById("resultat").innerText =
            "Le groupe ne correspond pas au verbe.";
        return;
    }

    const radical = getRadical(verbe, groupe, tense);
    const index = personnes.indexOf(pronom);

    let terminaison;

    if (tense === "futur") {
        terminaison = terminaisons.futur.all[index];
    } else {
        terminaison = terminaisons[tense][groupe][index];
    }

    const resultat = pronom + " " + radical + terminaison;

    document.getElementById("resultat").innerText = resultat;
}

document.getElementById("valider").addEventListener("click", conjuguer);

</script>

</body>
</html>
